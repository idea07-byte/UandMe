# Render Deployment Blueprint for UandMe (Fullstack Monorepo)
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Socket.IO)
  # -------------------------------------------------------------
  - type: web
    name: uandme-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon # or singapore / frankfurt
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "5000"
      - key: CLIENT_URL
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: MONGODB_URI
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite + Tailwind SPA)
  # -------------------------------------------------------------
  - type: static_site
    name: uandme-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://uandme-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://uandme-backend.onrender.com
      - key: VITE_SUPABASE_PROJECT_ID
        value: gujrjohtfuaadxiikkju
      - key: VITE_SUPABASE_URL
        value: https://gujrjohtfuaadxiikkju.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_IoiKJ60KZxGNPBqQ72U16Q_Dx1R1xJn
      - key: VITE_ENABLE_MOCK_FALLBACK
        value: "true"
      - key: VITE_SOCKET_RECONNECT_ATTEMPTS
        value: "5"
      - key: VITE_SOCKET_RECONNECT_DELAY
        value: "2000"
